# fly.toml app configuration file generated for curvefevertv on 2026-05-09T20:37:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'curvefevertv'
primary_region = 'iad'

[build]

[env]
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
